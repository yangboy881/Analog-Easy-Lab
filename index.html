<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OTA Tuner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  /* Layout: one drafting sheet. Title block and timer on top, schematic and Bode plot as plates on the left, spec card and bench sliders on the right, Check bar pinned below. */
  --paper: #0a2a4d;
  --paper-2: #0d3562;
  --plate: rgba(7, 33, 66, .72);
  --rule: rgba(150, 200, 255, .17);
  --edge: rgba(150, 200, 255, .38);
  --ink: #e6f2ff;
  --ink-dim: #93b9e4;
  --cyan: #6fd8ff;
  --amber: #ffc857;
  --green: #5be3a3;
  --red: #ff6b73;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--rule) 1px, transparent 1px),
    linear-gradient(90deg, var(--rule) 1px, transparent 1px),
    linear-gradient(rgba(150, 200, 255, .07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(150, 200, 255, .07) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 0;
}

/* ---------- HUD / title block ---------- */
.hud {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px 16px;
  align-items: end;
  padding: 10px 14px 0;
  border: 1px solid var(--edge);
  background: var(--plate);
}
.brand { min-width: 0; }
.brand-name {
  display: block;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 26px;
  letter-spacing: .14em;
  text-transform: uppercase;
  line-height: 1;
}
.brand-sub {
  display: block;
  margin-top: 4px;
  color: var(--ink-dim);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hud-stats { display: flex; align-items: flex-end; gap: 16px; }
.stat { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.stat .k { font-size: 10px; letter-spacing: .14em; color: var(--ink-dim); }
.stat .v { font-size: 20px; font-weight: 600; line-height: 1.1; }
.stat .v.warn { color: var(--red); animation: blink .8s steps(2) infinite; }
.pips { display: flex; gap: 4px; height: 22px; align-items: center; }
.pip {
  width: 9px; height: 17px; border: 1.5px solid var(--cyan); border-radius: 2px;
  background: var(--cyan); box-shadow: 0 0 8px rgba(111, 216, 255, .5); transition: all .25s;
}
.pip.off { background: transparent; box-shadow: none; opacity: .35; }
.ghost {
  min-height: 36px; padding: 0 12px; background: transparent; border: 1px solid var(--edge);
  font-size: 11px; letter-spacing: .12em; cursor: pointer;
}
.ghost:hover { border-color: var(--cyan); color: var(--cyan); }
.timebar { grid-column: 1 / -1; height: 4px; margin: 0 -14px; background: rgba(150, 200, 255, .12); }
.timebar i { display: block; height: 100%; width: 100%; background: var(--cyan); transform-origin: left; transition: background .3s; }
.timebar i.warn { background: var(--red); }

/* ---------- plates ---------- */
.main { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; padding-bottom: 12px; }
.colL, .colR { display: contents; }
.plate { border: 1px solid var(--edge); background: var(--plate); padding: 10px 14px 14px; min-width: 0; }
.plate-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.plate-title {
  font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .16em; text-transform: uppercase;
}
.plate-note { color: var(--ink-dim); font-size: 11px; letter-spacing: .06em; text-align: right; }
#pSch { order: 1; } #pSpec { order: 2; } #pCtl { order: 3; } #pBode { order: 4; }

svg.sch, svg.bode { display: block; width: 100%; height: auto; max-width: 100%; }
.w { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.w.thin { stroke-width: 1.2; opacity: .85; }
.arrow { fill: var(--ink); }
.dot { fill: var(--ink); }
.rail { stroke: var(--ink-dim); stroke-width: 2; }
.lbl { fill: var(--ink-dim); font-family: var(--font-mono); font-size: 11px; }
.lbl.dev { fill: var(--ink); font-weight: 600; font-size: 12px; }
.lbl.val { fill: var(--amber); }
.halo { fill: rgba(255, 107, 115, .0); stroke: none; }
.mos.bad .w, .mos.bad .arrow { stroke: var(--red); fill: var(--red); }
.mos.bad .w { fill: none; }
.mos.bad .halo { animation: halo .7s ease-in-out infinite; }
.mos.bad .lbl { fill: var(--red); }
.glow { fill: none; stroke: var(--amber); stroke-linecap: round; stroke-linejoin: round; opacity: .3; filter: url(#blur); }
.flow { fill: none; stroke: var(--amber); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.1 11; }
.glow.ac { stroke: var(--cyan); }
.flow.ac { stroke: var(--cyan); }
@keyframes halo { 0%, 100% { fill: rgba(255, 107, 115, .08); } 50% { fill: rgba(255, 107, 115, .42); } }
@keyframes blink { 50% { opacity: .35; } }

.hint {
  margin-top: 8px; padding: 8px 10px; border-left: 3px solid var(--green); background: rgba(91, 227, 163, .08);
  font-size: 12px; min-height: 3.4em;
}
.hint.bad { border-color: var(--red); background: rgba(255, 107, 115, .12); }
.hint.tip { border-color: var(--amber); background: rgba(255, 200, 87, .09); }
.hint b { font-weight: 600; }

/* ---------- spec card ---------- */
.specs { display: flex; flex-direction: column; gap: 12px; }
.spec { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.spec .nm { font-size: 11px; letter-spacing: .12em; color: var(--ink-dim); }
.spec .rd { font-size: 14px; text-align: right; }
.spec .rd small { color: var(--ink-dim); font-size: 11px; }
.bar { grid-column: 1 / -1; position: relative; height: 12px; background: rgba(150, 200, 255, .12); border: 1px solid var(--rule); }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--amber); transition: width .12s linear, background .2s; }
.bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); left: 71.43%; }
.spec.ok .bar i { background: var(--green); box-shadow: 0 0 10px rgba(91, 227, 163, .55); }
.spec.ok .rd { color: var(--green); }
.spec.over .bar i { background: var(--red); }
.spec.over .rd { color: var(--red); }
.satrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.satrow .nm { font-size: 11px; letter-spacing: .12em; color: var(--ink-dim); margin-right: 4px; }
.sat { padding: 2px 8px; border: 1px solid var(--green); color: var(--green); font-size: 11px; }
.sat.bad { border-color: var(--red); color: var(--red); background: rgba(255, 107, 115, .15); animation: blink .8s steps(2) infinite; }
.cardnote { color: var(--ink-dim); font-size: 11px; }

/* ---------- sliders ---------- */
.ctls { display: flex; flex-direction: column; gap: 14px; }
.ctl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ctl-name { font-size: 11px; letter-spacing: .12em; color: var(--ink-dim); }
.ctl-val { font-size: 16px; font-weight: 600; color: var(--amber); }
.ctl-row { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 6px; }
.step {
  width: 44px; height: 44px; border: 1px solid var(--edge); background: transparent; font-size: 20px; cursor: pointer;
  touch-action: manipulation;
}
.step:active { background: rgba(255, 200, 87, .18); border-color: var(--amber); }
.ctl-sub { margin-top: 0; color: var(--ink-dim); font-size: 11px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 3px;
  background: linear-gradient(to right, var(--amber) var(--fill, 50%), rgba(150, 200, 255, .26) var(--fill, 50%));
}
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(150, 200, 255, .26); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--amber); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 30px; height: 30px; margin-top: -12px; border-radius: 50%;
  background: var(--paper); border: 3px solid var(--amber); box-shadow: 0 0 0 5px rgba(255, 200, 87, .16);
}
input[type=range]::-moz-range-thumb {
  width: 24px; height: 24px; border-radius: 50%; background: var(--paper); border: 3px solid var(--amber);
  box-shadow: 0 0 0 5px rgba(255, 200, 87, .16);
}
input[type=range]:focus-visible, .step:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ---------- bode ---------- */
.gridl { stroke: var(--rule); stroke-width: 1; fill: none; }
.gridl.zero { stroke: rgba(150, 200, 255, .45); }
.axis { stroke: var(--edge); fill: none; }
.t { fill: var(--ink-dim); font-family: var(--font-mono); font-size: 9.5px; }
.curve { fill: none; stroke: var(--cyan); stroke-width: 2.2; stroke-linejoin: round; }
.phase { fill: none; stroke: var(--ink-dim); stroke-width: 1.5; stroke-dasharray: 5 4; opacity: .9; }
.tgt { stroke: var(--amber); stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
.tgt.ok { stroke: var(--green); }
.tgtt { fill: var(--amber); font-family: var(--font-mono); font-size: 9.5px; }
.tgtt.ok { fill: var(--green); }
.mk { fill: var(--paper); stroke: var(--cyan); stroke-width: 2; }
.mkt { fill: var(--ink); font-family: var(--font-mono); font-size: 10px; }
.readout { display: flex; flex-wrap: wrap; gap: 2px 16px; margin-top: 6px; color: var(--ink-dim); font-size: 11px; }
.readout b { color: var(--ink); font-weight: 500; }

/* ---------- action bar ---------- */
.actionbar {
  position: sticky; bottom: 0; z-index: 5;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(8, 36, 72, .94); border-top: 1px solid var(--edge);
  display: flex; align-items: center; gap: 14px; justify-content: space-between;
}
.actionbar .inner { width: 100%; max-width: 1088px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.count { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.count .k { font-size: 10px; letter-spacing: .14em; color: var(--ink-dim); }
.dots { display: flex; gap: 6px; }
.dots i { width: 14px; height: 14px; border: 1.5px solid var(--ink-dim); border-radius: 50%; transition: all .2s; }
.dots i.on { background: var(--green); border-color: var(--green); box-shadow: 0 0 8px rgba(91, 227, 163, .7); }
.cta {
  min-height: 52px; min-width: 168px; padding: 0 26px; background: var(--amber); color: #0a2a4d; border: 0;
  font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; cursor: pointer;
  touch-action: manipulation;
}
.cta:active { transform: translateY(1px); }
.cta:disabled { opacity: .45; cursor: default; }
.cta.alt { background: transparent; color: var(--ink); border: 1px solid var(--edge); }

/* ---------- overlays ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(5, 22, 46, .78); overflow-y: auto;
}
.overlay[hidden] { display: none; }
.card {
  width: 100%; max-width: 460px; margin: auto; padding: 20px 20px 22px; background: var(--paper); border: 1px solid var(--cyan);
  box-shadow: 0 0 0 4px rgba(111, 216, 255, .1), 0 18px 50px rgba(0, 0, 0, .45);
}
.card h2 { margin: 2px 0 6px; font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.05; }
.card .eyebrow { font-size: 11px; letter-spacing: .16em; color: var(--ink-dim); text-transform: uppercase; }
.card p { margin: 6px 0 0; color: var(--ink-dim); }
.card .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.card .btns .cta { flex: 1 1 150px; }
.spec-list { margin: 14px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
.spec-list li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.spec-list li span:first-child { color: var(--ink-dim); letter-spacing: .08em; font-size: 11px; }
.spec-list li.miss span:last-child { color: var(--red); }
.spec-list li.hit span:last-child { color: var(--green); }
.stars { display: flex; gap: 8px; margin: 10px 0 4px; }
.stars svg { width: 46px; height: 46px; fill: var(--amber); stroke: var(--amber); stroke-width: 1; stroke-linejoin: round; opacity: 0; transform: scale(.4); animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) forwards; filter: drop-shadow(0 0 8px rgba(255, 200, 87, .6)); }
.stars svg:nth-child(2) { animation-delay: .18s; } .stars svg:nth-child(3) { animation-delay: .36s; }
@keyframes pop { to { opacity: 1; transform: scale(1); } }
.chiprow { display: flex; gap: 6px; margin: 8px 0 2px; align-items: center; }
.chipi { width: 26px; height: 26px; fill: none; stroke: var(--ink-dim); stroke-width: 1.4; opacity: .4; }
.chipi.on { stroke: var(--cyan); fill: rgba(111, 216, 255, .22); opacity: 1; filter: drop-shadow(0 0 6px rgba(111, 216, 255, .7)); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 14px; }
.tile { text-align: left; padding: 10px; min-height: 76px; background: transparent; border: 1px solid var(--edge); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.tile:hover:not(:disabled) { border-color: var(--cyan); }
.tile:disabled { opacity: .35; cursor: default; }
.tile.cur { border-color: var(--amber); }
.tile .n { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: .06em; line-height: 1; }
.tile .nm2 { font-size: 11px; color: var(--ink-dim); line-height: 1.25; }
.tile .st { color: var(--amber); font-size: 13px; letter-spacing: .1em; margin-top: auto; }

/* ---------- wide layout ---------- */
@media (min-width: 900px) {
  .main { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); align-items: start; gap: 12px; }
  .colL, .colR { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  #pSch, #pSpec, #pCtl, #pBode { order: 0; }
}
@media (max-width: 560px) {
  .hud { grid-template-columns: 1fr; }
  .hud-stats { justify-content: space-between; width: 100%; padding-bottom: 8px; }
}
@media (max-width: 420px) {
  .brand-name { font-size: 22px; }

}
@media (prefers-reduced-motion: reduce) {
  .stat .v.warn, .sat.bad, .mos.bad .halo { animation: none; }
  .stars svg { animation: none; opacity: 1; transform: none; }
}

[hidden] { display: none !important; }
.hud-stats .score { color: var(--amber); }
.home-title { display: flex; flex-direction: column; gap: 4px; padding: 6px 2px 14px; }
.home-title .brand-name { font-size: 40px; }
.notice { margin-top: 12px; padding: 10px 12px; border-left: 3px solid var(--amber); background: rgba(255, 200, 87, .09); font-size: 12px; line-height: 1.6; }
.notice b { color: var(--amber); font-weight: 600; letter-spacing: .1em; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg-b { min-height: 56px; padding: 8px 10px; background: transparent; border: 1px solid var(--edge); cursor: pointer; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left; touch-action: manipulation; }
.seg-b b { font-size: 14px; font-weight: 600; }
.seg-b span { font-size: 11px; color: var(--ink-dim); }
.seg-b.on { border-color: var(--amber); background: rgba(255, 200, 87, .12); }
.seg-b.on span { color: var(--amber); }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; padding-bottom: 20px; }
.cat { text-align: left; padding: 14px; min-height: 168px; border: 1px solid var(--edge); background: var(--plate); cursor: pointer; display: flex; flex-direction: column; gap: 6px; touch-action: manipulation; min-width: 0; }
.cat:hover, .cat:focus-visible { border-color: var(--cyan); }
.cat.sprint { border-color: var(--amber); }
.cat-n { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: .1em; text-transform: uppercase; line-height: 1; }
.cat-s { font-size: 11px; letter-spacing: .12em; color: var(--cyan); text-transform: uppercase; }
.cat.sprint .cat-s { color: var(--amber); }
.cat-d { font-size: 12px; color: var(--ink-dim); line-height: 1.55; }
.cat-f { margin-top: auto; display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--ink-dim); padding-top: 8px; border-top: 1px solid var(--rule); }
.cat-f b { color: var(--ink); font-weight: 600; }
.tog { width: 100%; min-height: 48px; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 0 12px; background: transparent; border: 1px solid var(--edge); cursor: pointer; text-align: left; touch-action: manipulation; }
.tog .tg-name { font-size: 11px; letter-spacing: .12em; color: var(--ink-dim); }
.tog .tg-state { font-size: 12px; font-weight: 600; color: var(--ink-dim); }
.tog .tg-sw { width: 38px; height: 20px; border: 1.5px solid var(--edge); border-radius: 10px; position: relative; }
.tog .tg-sw i { position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--ink-dim); transition: left .15s; }
.tog.on { border-color: var(--amber); }
.tog.on .tg-state { color: var(--amber); }
.tog.on .tg-sw { border-color: var(--amber); }
.tog.on .tg-sw i { left: 21px; background: var(--amber); }
.ctl .ctl-sub { margin-top: 6px; }
.info { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--ink-dim); font-size: 11px; padding-top: 4px; border-top: 1px solid var(--rule); }
.stars-live { display: flex; gap: 3px; font-size: 20px; line-height: 1; }
.stars-live i { font-style: normal; color: rgba(150, 200, 255, .3); transition: color .15s, text-shadow .15s; }
.stars-live i.on { color: var(--amber); text-shadow: 0 0 8px rgba(255, 200, 87, .7); }
.actionbar .btnrow { display: flex; gap: 10px; align-items: center; }
.cta.sm { min-width: 0; min-height: 52px; padding: 0 16px; font-size: 18px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 30; max-width: min(92vw, 520px); padding: 10px 14px; background: var(--paper-2); border: 1px solid var(--cyan); font-size: 12px; line-height: 1.5; text-align: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); }
.toast.bad { border-color: var(--red); }
.toast.ok { border-color: var(--green); }
.bigscore { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: 1; color: var(--amber); margin: 8px 0 2px; text-shadow: 0 0 18px rgba(255, 200, 87, .35); }
.pb { color: var(--green); letter-spacing: .12em; margin: 0 0 6px; }
.card .stars svg { width: 38px; height: 38px; }
.pips { flex-wrap: wrap; max-width: 120px; }
.stars svg:nth-child(4) { animation-delay: .54s; } .stars svg:nth-child(5) { animation-delay: .72s; }

<script>
(function () {
'use strict';
/* ================= OTA Tuner · pure logic (no DOM) ================= */
const VDD = 1.8, KN = 200e-6, KP = 70e-6, WI = 0.073, LAMN = 0.02, LAMP = 0.025;
const COX = 30e-15;   // F per um^2, game-scaled gate capacitance density
const CAPD = 20e-15;  // F per um^2, capacitor density
const VTH = 0.5, TP = 2 * Math.PI;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const posToVal = (pos, lim) => lim[0] * Math.pow(lim[1] / lim[0], pos / 1000);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const vovOf = (id, K, wl) => Math.sqrt(2 * id / (K * wl));
const gmOf = (id, vov) => 2 * id / (vov + WI);

/* ---- transfer function helper: poles, LHP zeros, RHP zeros (Hz) ---- */
function loopAt(A0, P, Z, R, f) {
  let mag = 20 * Math.log10(A0), ph = 0;
  for (const p of P) { const r = f / p; mag -= 10 * Math.log10(1 + r * r); ph -= Math.atan(r); }
  for (const z of Z) { const r = f / z; mag += 10 * Math.log10(1 + r * r); ph += Math.atan(r); }
  for (const z of R) { const r = f / z; mag += 10 * Math.log10(1 + r * r); ph -= Math.atan(r); }
  return { mag, ph: ph * 180 / Math.PI };
}
function unity(A0, P, Z, R) {
  if (!(A0 > 1) || loopAt(A0, P, Z, R, 1).mag <= 0) return { fu: 1, pm: 90 };
  let lo = 0, hi = 12;
  for (let i = 0; i < 70; i++) { const mid = (lo + hi) / 2; if (loopAt(A0, P, Z, R, Math.pow(10, mid)).mag > 0) lo = mid; else hi = mid; }
  const fu = Math.pow(10, lo);
  return { fu, pm: clamp(180 + loopAt(A0, P, Z, R, fu).ph, -90, 120) };
}
const AREA_TAIL = 0.69; // W/L of a bias device per uA at Vov = 0.12 V

const SLOTW = { pwr: 40, area: 25, gain: 12, bw: 12, pm: 6, time: 5 };
const SLOTS = ['gain', 'bw', 'pm', 'pwr', 'area'];

/* ================= modules ================= */
const MODS = {};

/* ---------- 1. OPA: 5T OTA ---------- */
MODS.opa = {
  id: 'opa', name: 'OPA', full: '5T OTA 基本運算放大器',
  blurb: '單級放大器：調輸入對、負載鏡、尾電流與通道長度。',
  sliders: [
    { k: 'w1', name: '輸入對 M1/M2', unit: 'W/L', lim: [1, 400] },
    { k: 'w3', name: '負載鏡 M3/M4', unit: 'W/L', lim: [0.5, 100] },
    { k: 'it', name: '尾電流 M5', unit: 'µA', lim: [1, 150] },
    { k: 'L', name: '通道長度 L', unit: 'µm', lim: [0.18, 2] }
  ],
  toggles: [],
  specs: [
    { k: 'gain', slot: 'gain', label: 'DC GAIN', unit: 'dB', type: 'min', dig: 1 },
    { k: 'gbw', slot: 'bw', label: 'GBW', unit: 'MHz', type: 'min', dig: 1 },
    { k: 'pm', slot: 'pm', label: 'PHASE MARGIN', unit: '°', type: 'min', dig: 0 },
    { k: 'pwr', slot: 'pwr', label: 'POWER', unit: 'µW', type: 'max', dig: 0 },
    { k: 'area', slot: 'area', label: 'AREA', unit: 'µm²', type: 'max', dig: 0 }
  ],
  devs: ['M1', 'M2', 'M3', 'M4', 'M5'],
  plot: { kind: 'bode', lf0: 3, lf1: 9, dbMax: 60, dbMin: -20, fSlot: 'bw', fScale: 1e6 },
  genCtx(d, rng) { return { cl: +(lerp(1, 9, d) * (0.85 + 0.3 * rng())).toFixed(1), vout: 1.05 }; },
  ctxLabel(c) { return 'CL ' + c.cl + ' pF'; },
  sample(rng) { return { pos: { w1: rng() * 1000, w3: rng() * 1000, it: rng() * 1000, L: rng() * 1000 }, tog: {} }; },
  accept(r) { return r.v.gain > 28 && r.v.gbw > 1.5 && r.v.pm > 40 && r.v.pwr < 260; },
  solve(p, ctx) {
    const it = p.it * 1e-6, id = it / 2, CL = ctx.cl * 1e-12, L = p.L;
    const lamN = LAMN / L, lamP = LAMP / L;
    const vov1 = vovOf(id, KN, p.w1), gm1 = gmOf(id, vov1);
    const vov3 = vovOf(id, KP, p.w3), gm3 = gmOf(id, vov3);
    const ro = 1 / ((lamN + lamP) * id);
    const vtail = 0.9 - VTH - vov1;
    const okTail = vtail >= 0.12;
    const okIn = (VDD - VTH - vov3) - vtail >= vov1;
    const okLoad = (VDD - ctx.vout) >= vov3;
    const bad = [];
    if (!okTail) bad.push('M5');
    if (!okIn) bad.push('M1', 'M2');
    if (!okLoad) bad.push('M4');
    const A0 = gm1 * ro * (bad.length ? 0.05 : 1);
    const cm = 5 * 2 * (2 / 3) * COX * p.w3 * L * L;
    const fm = gm3 / (TP * cm), fp1 = 1 / (TP * ro * CL);
    const P = [fp1, fm], Z = [], R = [];
    const u = unity(A0, P, Z, R);
    const area = (2 * p.w1 + 2 * p.w3 + AREA_TAIL * p.it) * L * L;
    let hint;
    if (!okTail) hint = { c: 'bad', m: `<b>M5 離開飽和</b>：尾端節點只有 ${vtail.toFixed(2)} V，需要 ≥ 0.12 V。輸入對 Vov = ${(vov1 * 1000).toFixed(0)} mV。加大輸入對 W/L，或降低尾電流。` };
    else if (!okIn) hint = { c: 'bad', m: `<b>M1/M2 離開飽和</b>：負載 Vov = ${(vov3 * 1000).toFixed(0)} mV 太大，鏡像把輸入對汲極拉太低。加大負載 W/L。` };
    else if (!okLoad) hint = { c: 'bad', m: `<b>M4 離開飽和</b>：負載 Vov = ${(vov3 * 1000).toFixed(0)} mV，但 M4 只剩 ${(VDD - ctx.vout).toFixed(2)} V 跨壓。加大負載 W/L。` };
    else if (vov1 < 0.04) hint = { c: 'tip', m: `<b>弱反轉</b>：輸入對 Vov 只有 ${(vov1 * 1000).toFixed(0)} mV，再加 W/L 對 gm 幾乎沒有幫助，改調電流。` };
    else hint = { c: 'ok', m: `<b>五顆電晶體都在飽和區</b>。增益 = gm × ro：Vov 越小增益越高；加長 L 讓 ro 變大，但面積與鏡像極點會變差。` };
    return {
      v: { gain: 20 * Math.log10(A0), gbw: gm1 / (TP * CL) / 1e6, pm: u.pm, pwr: VDD * p.it, area },
      bad, hint, tf: { A0, P, Z, R, fu: u.fu, pm: u.pm },
      aux: { id: id * 1e6, it: p.it },
      info: [`gm1 ${(gm1 * 1e6).toFixed(0)} µS`, `Vov1 ${(vov1 * 1000).toFixed(0)} mV`, `ro ${(ro / 1e3).toFixed(0)} kΩ`, `鏡像極點 ${fmtHz(fm)}`]
    };
  }
};

/* ---------- 2. Two-stage OPA (Miller) ---------- */
MODS.two = {
  id: 'two', name: 'Two-stage', full: '兩級 Miller 補償運算放大器',
  blurb: '第二級與 Cc：處理極點分裂、右半平面零點與電流匹配。',
  sliders: [
    { k: 'w1', name: '輸入對 M1/M2', unit: 'W/L', lim: [1, 400] },
    { k: 'it', name: '尾電流 M5', unit: 'µA', lim: [1, 100] },
    { k: 'w6', name: '第二級 M6', unit: 'W/L', lim: [1, 400] },
    { k: 'i2', name: '第二級電流 M7', unit: 'µA', lim: [2, 300] },
    { k: 'cc', name: '補償電容 Cc', unit: 'pF', lim: [0.1, 10] },
    { k: 'L', name: '通道長度 L', unit: 'µm', lim: [0.18, 2] }
  ],
  toggles: [{ k: 'rz', name: 'Rz 調零電阻', on: '開：零點移到左半平面（+10 µm²）', off: '關：右半平面零點會拉低 PM' }],
  specs: [
    { k: 'gain', slot: 'gain', label: 'DC GAIN', unit: 'dB', type: 'min', dig: 1 },
    { k: 'gbw', slot: 'bw', label: 'GBW', unit: 'MHz', type: 'min', dig: 1 },
    { k: 'pm', slot: 'pm', label: 'PHASE MARGIN', unit: '°', type: 'min', dig: 0 },
    { k: 'pwr', slot: 'pwr', label: 'POWER', unit: 'µW', type: 'max', dig: 0 },
    { k: 'area', slot: 'area', label: 'AREA', unit: 'µm²', type: 'max', dig: 0 }
  ],
  devs: ['M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7'],
  plot: { kind: 'bode', lf0: 3, lf1: 9, dbMax: 100, dbMin: -20, fSlot: 'bw', fScale: 1e6 },
  genCtx(d, rng) { return { cl: +(lerp(2, 12, d) * (0.85 + 0.3 * rng())).toFixed(1), vout: 0.9 }; },
  ctxLabel(c) { return 'CL ' + c.cl + ' pF'; },
  sample(rng) { return { pos: { w1: rng() * 1000, it: rng() * 1000, w6: rng() * 1000, i2: rng() * 1000, cc: rng() * 1000, L: rng() * 1000 }, tog: { rz: rng() < 0.5 ? 1 : 0 } }; },
  accept(r) { return r.v.gain > 55 && r.v.gbw > 1 && r.v.pm > 40 && r.v.pwr < 450; },
  solve(p, ctx) {
    const it = p.it * 1e-6, id1 = it / 2, i2 = p.i2 * 1e-6, L = p.L, CL = ctx.cl * 1e-12, Cc = p.cc * 1e-12;
    const lt = (LAMN + LAMP) / L, w3 = 30;
    const vov1 = vovOf(id1, KN, p.w1), gm1 = gmOf(id1, vov1);
    const vov3 = vovOf(id1, KP, w3);
    const vov6 = vovOf(i2, KP, p.w6), gm6 = gmOf(i2, vov6);
    const ro1 = 1 / (lt * id1), ro2 = 1 / (lt * i2);
    const vtail = 0.9 - VTH - vov1;
    const ratio = i2 / (id1 * p.w6 / w3);
    const okTail = vtail >= 0.12, okIn = (VDD - VTH - vov3) - vtail >= vov1;
    const okM6 = ratio >= 0.5 && vov6 <= 0.9, okM7 = ratio <= 2;
    const bad = [];
    if (!okTail) bad.push('M5');
    if (!okIn) bad.push('M1', 'M2');
    if (!okM6) bad.push('M6');
    if (!okM7) bad.push('M7');
    const A0 = gm1 * ro1 * gm6 * ro2 * (bad.length ? 0.05 : 1);
    const fp1 = 1 / (TP * gm6 * ro1 * ro2 * Cc), p2 = gm6 / (TP * CL), z = gm6 / (TP * Cc);
    const P = [fp1, p2], Z = p.rz ? [z] : [], R = p.rz ? [] : [z];
    const u = unity(A0, P, Z, R);
    const area = (2 * p.w1 + 2 * w3 + AREA_TAIL * p.it + p.w6 + AREA_TAIL * p.i2) * L * L + (p.cc * 1e-12 / CAPD) + (p.rz ? 10 : 0);
    let hint;
    if (!okTail) hint = { c: 'bad', m: `<b>M5 離開飽和</b>：尾端只剩 ${vtail.toFixed(2)} V。加大輸入對 W/L，或降低尾電流。` };
    else if (!okIn) hint = { c: 'bad', m: `<b>M1/M2 離開飽和</b>：第一級鏡像把汲極拉太低。加大輸入對 W/L 或降低尾電流。` };
    else if (!okM6) hint = { c: 'bad', m: `<b>M6 離開飽和</b>：第二級電流與 M6 不匹配（比值 ${ratio.toFixed(2)}，需 0.5～2）。把 M6 W/L 調大，或降低 i2。` };
    else if (!okM7) hint = { c: 'bad', m: `<b>M7 離開飽和</b>：第二級電流太大（比值 ${ratio.toFixed(2)}，需 0.5～2）。降低 i2，或加大 M6 W/L。` };
    else hint = { c: 'ok', m: `<b>兩級都在飽和區</b>。GBW = gm1/(2πCc)，次極點 = gm6/(2πCL)，右半平面零點 = gm6/(2πCc)。PM 不夠時加大 gm6，或開啟 Rz。` };
    return {
      v: { gain: 20 * Math.log10(A0), gbw: gm1 / (TP * Cc) / 1e6, pm: u.pm, pwr: VDD * (p.it + p.i2), area },
      bad, hint, tf: { A0, P, Z, R, fu: u.fu, pm: u.pm },
      aux: { id: id1 * 1e6, it: p.it, i2: p.i2, rz: p.rz },
      info: [`gm1 ${(gm1 * 1e6).toFixed(0)} µS`, `gm6 ${(gm6 * 1e6).toFixed(0)} µS`, `次極點 ${fmtHz(p2)}`, `零點 ${fmtHz(z)}`]
    };
  }
};

/* ---------- 3. Current source (mirror / cascode) ---------- */
MODS.cs = {
  id: 'cs', name: '電流源', full: '電流鏡與疊接電流源',
  blurb: '輸出阻抗、電流精度、最低輸出電壓與失配的取捨。',
  sliders: [
    { k: 'iref', name: '參考電流 Iref', unit: 'µA', lim: [2, 100] },
    { k: 'wm', name: '鏡像 W/L', unit: 'W/L', lim: [1, 200] },
    { k: 'L', name: '通道長度 L', unit: 'µm', lim: [0.18, 4] }
  ],
  toggles: [{ k: 'casc', name: '疊接 Cascode', on: '開：Rout ≈ gm·ro²，最低輸出電壓升到 Vth + 2Vov', off: '關：Rout = ro，最低輸出電壓 = Vov' }],
  specs: [
    { k: 'rout', slot: 'gain', label: 'ROUT', unit: 'dBΩ', type: 'min', dig: 1 },
    { k: 'err', slot: 'bw', label: 'CURRENT ERROR', unit: '%', type: 'max', dig: 2 },
    { k: 'vmin', slot: 'pm', label: 'MIN VOUT', unit: 'V', type: 'max', dig: 2 },
    { k: 'pwr', slot: 'pwr', label: 'POWER', unit: 'µW', type: 'max', dig: 0 },
    { k: 'area', slot: 'area', label: 'AREA', unit: 'µm²', type: 'max', dig: 0 }
  ],
  devs: ['MR', 'MO', 'MCR', 'MCO'],
  plot: { kind: 'iv' },
  genCtx(d, rng) {
    const n = Math.max(1, Math.round(lerp(1, 8, d) * (0.7 + 0.6 * rng())));
    return { n, vout: +lerp(1.4, 0.75, d + (rng() - 0.5) * 0.2).toFixed(2) };
  },
  ctxLabel(c) { return `Iout = ${c.n} × Iref · VOUT ${c.vout} V`; },
  sample(rng, d) { return { pos: { iref: rng() * 1000, wm: rng() * 1000, L: rng() * 1000 }, tog: { casc: rng() < (d > 0.25 ? 0.6 : 0.3) ? 1 : 0 } }; },
  accept(r) { return r.v.rout > 60 && r.v.err < 8 && r.v.pwr < 700; },
  solve(p, ctx) {
    const iref = p.iref * 1e-6, n = ctx.n, iout = n * iref, L = p.L, lam = LAMN / L;
    const vov = vovOf(iref, KN, p.wm), gm = gmOf(iout, vov);

/* ================= design decode / level generator ================= */
function decode(mod, pos, tog) {
  const p = {};

  mod.toggles.forEach(t => { p[t.k] = (tog && tog[t.k]) ? 1 : 0; });

}

  if (sp.unit === 'dB' || sp.unit === 'dBΩ') return { abs: lerp(8, 2.5, d) };
  if (sp.unit === '°') return { abs: lerp(14, 5, d) };
  if (sp.unit === 'V') return { abs: lerp(0.18, 0.07, d) };

/* The reference design is picked first, then each spec is relaxed from it,

function genLevel(modId, d, seed) {

function specList(lv) {
  const rows = lv.specs.map(sp => `<li><span>${sp.label}</span><span class="num">${sp.type === 'min' ? '≥' : '≤'} ${fmtT(sp.target)} ${sp.unit}</span></li>`);
  rows.push(`<li><span>條件</span><span class="num">${MODS[lv.modId].ctxLabel(lv.ctx)}</span></li>`);
  return '<ul class="spec-list">' + rows.join('') + '</ul>';
}

/* ---------- home ---------- */
function showHome() {
  S.view = 'home'; S.running = false; hide();
  $('game').hidden = true; $('actionbar').hidden = true; $('home').hidden = false; $('hud').hidden = true;
  const L = prog.lives || 3; S.lives0 = L;
  $('livesSeg').innerHTML = [3, 5, 7].map(n => `<button type="button" class="seg-b ${n === L ? 'on' : ''}" data-n="${n}" aria-pressed="${n === L}"><b>${n} 點血</b><span>總分 ×${Math.round(LIFE_MULT[n] * 100)}%</span></button>`).join('');
  document.querySelectorAll('.seg-b').forEach(b => b.addEventListener('click', () => { prog.lives = +b.dataset.n; save(); showHome(); }));
  $('notice').innerHTML = `<b>公告</b>　選 3 點血：總分 ×100%；5 點血：×90%；7 點血：×80%。每次按 Check 若 5 項沒有全過，就扣 1 點血，結算時每用掉 1 點血再扣 ${PENALTY} 分。血歸零後一般模式仍可繼續（每次失敗照扣），競速模式會直接結束。`;
  $('cats').innerHTML = CATS.map(c => {
    const best = prog.best[c.id] || 0, cl = prog.cleared[c.id] || 0;
    return `<button type="button" class="cat" data-c="${c.id}"><span class="cat-n">${c.name}</span><span class="cat-s">${c.sub}</span><span class="cat-d">${c.desc}</span>
      <span class="cat-f"><span>最高 <b class="num">${best}</b></span><span>通關 <b class="num">${cl}/${NLEV}</b></span></span></button>`;
  }).join('') + `<button type="button" class="cat sprint" data-c="sprint"><span class="cat-n">競速 SPRINT</span><span class="cat-s">60 秒倒數 · 無上限</span>
    <span class="cat-d">五項全過 +${SPRINT_BONUS} 秒。四種電路隨機亂序，1–5 關簡單、6–10 關中等、11 關起困難。</span><span class="cat-f"><span>最高 <b class="num">${prog.best.sprint || 0}</b></span><span>最遠 <b class="num">${prog.cleared.sprint || 0} 關</b></span></span></button>`;
  document.querySelectorAll('.cat').forEach(b => b.addEventListener('click', () => startRun(b.dataset.c)));
}

/* ---------- run flow ---------- */
function seedOf(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function startRun(cat) {
  S.sprint = cat === 'sprint'; S.cat = cat; S.lives0 = prog.lives || 3; S.livesLeft = S.lives0; S.fails = 0; S.idx = 0; S.bests = []; S.weights = []; S.ended = false; S.sprintN = 0;
  S.levels = [];
  if (!S.sprint) {
    const rr = mulberry32((Math.random() * 1e9) | 0);
    for (let i = 0; i < NLEV; i++) {
      const id = cat === 'rand' ? MOD_ORDER[Math.floor(rr() * 4)] : cat;
      S.levels.push(genLevel(id, i / (NLEV - 1), cat === 'rand' ? ((rr() * 1e9) | 0) : seedOf(id + ':' + i)));
      S.weights.push(levelWeight(i));
    }
  } else { S.sprintTime = SPRINT_TIME; }
  $('home').hidden = true; $('game').hidden = false; $('actionbar').hidden = false; $('hud').hidden = false; S.view = 'game';
  $('btnSkip').hidden = !S.sprint;
  if (S.sprint) { S.time = SPRINT_TIME; nextSprintLevel(true); } else { S.time = LEVEL_TIME; loadLevel(0); }
}
function loadLevel(i) {
  S.idx = i; S.lv = S.levels[i]; S.mod = MODS[S.lv.modId]; S.curBest = 0; S.time = LEVEL_TIME;
  S.pos = {}; S.mod.sliders.forEach(s => { S.pos[s.k] = 500; }); S.tog = {}; S.mod.toggles.forEach(t => { S.tog[t.k] = 0; });
  buildGame(); renderHud(); refresh(); showIntro();
}
const sprintRng = () => (S._sr || (S._sr = mulberry32((Math.random() * 1e9) | 0)));
function nextSprintLevel(first) {
  S.sprintN++;
  const r = sprintRng(), id = MOD_ORDER[Math.floor(r() * 4)], d = sprintD(S.sprintN, r);
  S.lv = genLevel(id, d, (r() * 1e9) | 0); S.mod = MODS[id]; S.curBest = 0;
  S.pos = {}; S.mod.sliders.forEach(s => { S.pos[s.k] = 500; }); S.tog = {}; S.mod.toggles.forEach(t => { S.tog[t.k] = 0; });
  S.levelStart = S.time; S.idxW = SPRINT_W[sprintTier(S.sprintN)];
  buildGame(); renderHud(); refresh();
  if (first) showIntro(); else S.running = true;
}
function showIntro() {
  const lv = S.lv, m = S.mod;
  show(`<div class="eyebrow">${S.sprint ? '競速模式' : `第 ${S.idx + 1} / ${NLEV} 關`} · ${m.name}</div><h2>${S.sprint ? '60 秒倒數' : m.full}</h2>
    <p>${S.sprint ? `五項全過按 Check 才會計分並 +${SPRINT_BONUS} 秒；沒全過扣 1 點血。可以按「跳過」換題。` : `每關 ${LEVEL_TIME} 秒。調整滑桿讓 5 項規格達標後按 Check；沒有全過會扣 1 點血，但可以繼續調整。`}</p>
    ${specList(lv)}<div class="btns"><button class="cta" id="btnGo" type="button">開始</button></div>`);
  bind('btnGo', () => { hide(); S.running = true; S.levelStart = S.time; });
}

/* ---------- check ---------- */
function weightOf() { return S.sprint ? S.idxW : S.weights[S.idx]; }
function doCheck() {
  if (!S.running || S.ended) return;
  const lv = S.lv, res = S.res;
  const tf = S.sprint ? 1 - (S.levelStart - S.time) / SPRINT_REF : S.time / LEVEL_TIME;
  const a = attemptScore(lv, res.v, tf);
  S.curBest = Math.max(S.curBest, a.score);
  if (a.all) { levelDone(a); return; }
  S.fails++; S.livesLeft = Math.max(0, S.livesLeft - 1); renderHud();
  toast(`${a.n} / 5 項達標（+${a.n * 100} 分）· 失去 1 點血，結算 −${PENALTY} 分`, 'bad');
  if (S.sprint && S.livesLeft <= 0) { commitLevel(); endRun('血量歸零'); }
}
function commitLevel() {
  if (S.sprint) { S.bests.push(S.curBest); S.weights.push(S.idxW); }
  else { S.bests[S.idx] = S.curBest; }
}
function levelDone(a) {
  S.running = false; commitLevel();
  const w = weightOf(), lv = S.lv;
  if (S.sprint) {
    S.time = Math.min(SPRINT_TIME + 120, S.time + SPRINT_BONUS);
    prog.cleared.sprint = Math.max(prog.cleared.sprint || 0, S.sprintN); renderHud();
    toast(`第 ${S.sprintN} 關完成：${a.score} 分 ×${w} · +${SPRINT_BONUS} 秒`, 'ok');
    nextSprintLevel(false); return;
  }
  const last = S.idx === NLEV - 1;
  renderHud();
  show(`<div class="eyebrow">第 ${S.idx + 1} / ${NLEV} 關 · 全部達標</div><h2>五項全過</h2><div class="stars">${STAR.repeat(5)}</div>
    <ul class="spec-list"><li class="hit"><span>5 項規格 × 100</span><span class="num">500</span></li>
    <li class="hit"><span>FoM 評比（1–200）</span><span class="num">${a.fom}</span></li>
    <li><span>本關得分</span><span class="num">${a.score}</span></li><li><span>關卡權重</span><span class="num">× ${w.toFixed(1)}</span></li></ul>
    <p>FoM 權重：Power 40% · Area 25% · Gain 12% · GBW 12% · PM 6% · 時間 5%。每項要比規格多出約兩倍的餘裕才算滿分。</p>
    <div class="btns"><button class="cta" id="btnNext" type="button">${last ? '查看總成績' : '下一關'}</button></div>`);
  bind('btnNext', () => { hide(); if (last) endRun('完成 8 關'); else loadLevel(S.idx + 1); });
}
function timeUp() {
  S.running = false;
  if (S.sprint) { commitLevel(); endRun('時間到'); return; }
  commitLevel(); renderHud();
  const last = S.idx === NLEV - 1;
  show(`<div class="eyebrow">第 ${S.idx + 1} / ${NLEV} 關</div><h2>時間到</h2>
    <p>本關採計你最高的一次 Check：<b class="num">${S.curBest}</b> 分${S.curBest ? '' : '（沒有按過 Check）'}。</p>
    <div class="btns"><button class="cta" id="btnNext" type="button">${last ? '查看總成績' : '下一關'}</button></div>`);
  bind('btnNext', () => { hide(); if (last) endRun('完成 8 關'); else loadLevel(S.idx + 1); });
}
function skipLevel() {
  if (!S.running || !S.sprint) return;
  commitLevel(); toast(`跳過第 ${S.sprintN} 關，保留已拿到的 ${S.curBest} 分`, ''); nextSprintLevel(false);
}
function endRun(why) {
  S.ended = true; S.running = false;
  const t = totals(), key = S.sprint ? 'sprint' : S.cat;
  const cleared = S.sprint ? Math.max(0, S.sprintN - (why === '血量歸零' || why === '時間到' ? 1 : 0)) : S.bests.filter(b => b >= 500).length;
  const newBest = t.net > (prog.best[key] || 0);
  if (newBest) prog.best[key] = t.net;
  if (!S.sprint) prog.cleared[key] = Math.max(prog.cleared[key] || 0, cleared); else prog.cleared.sprint = Math.max(prog.cleared.sprint || 0, cleared);
  save(); renderHud();
  show(`<div class="eyebrow">${why}</div><h2>${S.sprint ? '競速結算' : '總成績'}</h2>
    <div class="bigscore num">${t.net}</div>${newBest ? '<p class="pb">個人新紀錄</p>' : ''}
    <ul class="spec-list"><li><span>各關加權總分</span><span class="num">${Math.round(t.gross)}</span></li>
    <li><span>血量加成（${S.lives0} 點血）</span><span class="num">× ${Math.round(t.mult * 100)}%</span></li>
    <li class="${S.fails ? 'miss' : ''}"><span>失敗 ${S.fails} 次</span><span class="num">− ${t.pen}</span></li>
    <li><span>全過關卡</span><span class="num">${cleared} / ${S.sprint ? S.bests.length : NLEV}</span></li></ul>
    <div class="btns"><button class="cta" id="again" type="button">再玩一次</button><button class="cta alt" id="home2" type="button">回首頁</button></div>`);
  bind('again', () => { hide(); startRun(S.cat); }); bind('home2', () => showHome());
}
function askHome() {
  if (S.view !== 'game' || S.ended) { showHome(); return; }
  const was = S.running;
  show(`<div class="eyebrow">離開本局</div><h2>回到首頁？</h2><p>目前這一局的進度不會保留。</p>
    <div class="btns"><button class="cta alt" id="stay" type="button">繼續玩</button><button class="cta" id="leave" type="button">離開</button></div>`);
  bind('stay', () => { hide(); S.running = was; }); bind('leave', () => showHome());
}

/* ---------- loop ---------- */
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.running) {
    S.time -= dt;
    if (S.time <= 0) { S.time = 0; renderTime(); timeUp(); } else renderTime();
  }
  for (let i = 0; i < flows.length; i++) { const f = flows[i]; f.off -= f.speed * dt; f.el.style.strokeDashoffset = f.off.toFixed(1); }
  requestAnimationFrame(tick);
}
$('btnCheck').addEventListener('click', doCheck);
$('btnSkip').addEventListener('click', skipLevel);
$('btnHome').addEventListener('click', askHome);
showHome();
requestAnimationFrame(t => { last = t; requestAnimationFrame(tick); });
window.__otaDebug = { S, doCheck, startRun, genLevel, MODS };

})();
</script>

</body></html>
